<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found - Lazy Intercom</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F5257">
<link rel="icon" type="image/png" href="/img/icon-512.png">
<style>
:root{--coral:#E8553A;--teal:#0F5257;--mustard:#F2B134;--cream:#FFF6E9;--charcoal:#23302F}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--cream);color:var(--charcoal);font:18px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-align:center;padding:24px}
main{max-width:30em}
h1{color:var(--teal);font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.15;margin:0 0 12px}
.code{display:inline-block;background:var(--coral);color:var(--charcoal);font-weight:800;border-radius:999px;padding:4px 16px;margin-bottom:14px}
a.btn{display:inline-block;background:var(--teal);color:var(--cream);font-weight:700;text-decoration:none;padding:12px 22px;border-radius:12px;min-height:48px;margin-top:8px}
a.btn:hover{background:var(--charcoal)}
:focus-visible{outline:3px solid var(--mustard);outline-offset:3px}
</style>
</head>
<body>
<main>
<span class="code">404</span>
<h1>This page took a nap</h1>
<p>The sloth looked everywhere, slowly, and could not find that page. Nobody shouted for it either.</p>
<a class="btn" href="/">Back to Lazy Intercom</a>
</main>
</body>
</html>
